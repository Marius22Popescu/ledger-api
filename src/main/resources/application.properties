spring.application.name=ledger-api

spring.datasource.url=jdbc:mysql://localhost:3306/ledger?sslMode=DISABLED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
spring.datasource.username=ledger
spring.datasource.password=ledger
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

spring.rabbitmq.host=localhost
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.prefetch=16

ledger.outbox.delay-ms=400
ledger.samples.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [requestId=%X{requestId}] [paymentId=%X{paymentId}] %logger{36} - %m%n
logging.level.com.ledger=INFO
